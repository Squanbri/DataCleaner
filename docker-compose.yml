services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: datacleaner
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]

volumes:
  pgdata:
